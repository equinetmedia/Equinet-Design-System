</g>
<g id="h2Bold">
<g id="Two Disciplines. One Connected System." filter="url(#filter0_d_373_3165)">
<text fill="#242630" style="white-space: pre" xml:space="preserve" font-family="Myriad Pro" font-size="36" font-weight="900" letter-spacing="0em"><tspan x="587.361" y="160.264">TWO DISCIPLINES. ONE CONNECTED SYSTEM.</tspan></text>
</g>
</g>
<g id="Lead-Text-Color">
<text id="We map the markets you can win, then engineer the operations that make winning them repeatable" fill="#00426C" style="white-space: pre" xml:space="preserve" font-family="Myriad Pro" font-size="20" font-style="italic" letter-spacing="0em"><tspan x="609.453" y="210">We map the markets you can win, then engineer the operations that make winning them </tspan><tspan x="916.875" y="236">repeatable</tspan></text>
</g>
</g>
<g id="container_2">
<g id="leftColumn" filter="url(#filter1_d_373_3165)">
<rect x="480" y="268" width="468" height="248" rx="8" fill="url(#paint1_linear_373_3165)" shape-rendering="crispEdges"/>
<text id="h3-Text" fill="#242630" style="white-space: pre" xml:space="preserve" font-family="Myriad Pro" font-size="24" font-weight="900" letter-spacing="0em"><tspan x="512" y="320.5">COMMERCIAL DATA</tspan></text>
<text id="Before you can forecast or prioritise, your commercial data has to be accurate. We audit, standardise and structure the datasets behind your CRM and forecasts, then use them to map the market you can realistically win." fill="#3B3F51" style="white-space: pre" xml:space="preserve" font-family="Myriad Pro" font-size="16" letter-spacing="0em"><tspan x="512" y="389">Before you can forecast or prioritise, your commercial data </tspan><tspan x="512" y="411">has to be accurate. We audit, standardise and structure the </tspan><tspan x="512" y="433">datasets behind your CRM and forecasts, then use them to </tspan><tspan x="512" y="455">map the market you can realistically win.</tspan></text>
</g>
<g id="rightColumn" filter="url(#filter2_d_373_3165)">
<rect x="972" y="268" width="468" height="248" rx="8" fill="url(#paint2_linear_373_3165)" shape-rendering="crispEdges"/>
<text id="h3-Text_2" fill="#242630" style="white-space: pre" xml:space="preserve" font-family="Myriad Pro" font-size="24" font-weight="900" letter-spacing="0em"><tspan x="1004" y="320.5">REVENUE OPERATIONS</tspan></text>
<text id="Once your commercial data is accurate, Revenue Operations puts it to work. It connects the systems built on that data, the deal process that depends on it, and the accounts it&#39;s already tracking, into one operating rhythm rather than four separate efforts." fill="#3B3F51" style="white-space: pre" xml:space="preserve" font-family="Myriad Pro" font-size="16" letter-spacing="0em"><tspan x="1004" y="389">Once your commercial data is accurate, Revenue Operations </tspan><tspan x="1004" y="411">puts it to work. It connects the systems built on that data, </tspan><tspan x="1004" y="433">the deal process that depends on it, and the accounts it&#39;s </tspan><tspan x="1004" y="455">already tracking, into one operating rhythm rather than four </tspan><tspan x="1004" y="477">separate efforts.</tspan></text>
</g>
